{% extends "base.html" %}

{% block title %}Login - CourseFlow{% endblock %}

{% block content %}
<section class="auth-shell">
    <div class="auth-panel">
        <p class="eyebrow">Welcome back</p>
        <h1>Login</h1>

        <form method="POST" class="stack-form">
            <div>
                <label for="username" class="form-label">Username</label>
                <input id="username" type="text" name="username" class="form-control" placeholder="Your username" required>
            </div>

            <div>
                <label for="password" class="form-label">Password</label>
                <input id="password" type="password" name="password" class="form-control" placeholder="Your password" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-box-arrow-in-right"></i>
                Login
            </button>
        </form>

        <p class="auth-switch">
            New here? <a href="/register">Create an account</a>
        </p>
    </div>
</section>
{% endblock %}
