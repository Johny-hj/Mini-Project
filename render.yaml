services:
  - type: web
    name: course-progress-track
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: course-progress-track-db
          property: connectionString

databases:
  - name: course-progress-track-db
    plan: free
    databaseName: courseprogresstrack
    user: courseprogresstrack_user
